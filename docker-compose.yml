version: "3.8"

services:
  cache-server:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped

  duckdb:
    image: datacatering/duckdb:v1.4.1
    ports:
      - "4213:4213"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
